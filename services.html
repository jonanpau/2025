<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Scroll Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
      height: 100vh;
    }

    .scroll-container {
      display: flex;
      flex-direction: row;
      width: 400vw; /* 4 sections */
      height: 100vh;
      transition: transform 0.5s ease-out;
    }

    section {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease;
    }

    section.active {
      opacity: 1;
      transform: translateY(0);
    }

    .one { background: #1abc9c; }
    .two { background: #3498db; }
    .three { background: #9b59b6; }
    .four { background: #e67e22; }

    @media (max-width: 768px) {
      section {
        font-size: 2rem;
        padding: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="scroll-container" id="scrollContainer">
    <section class="one active">Section One</section>
    <section class="two">Section Two</section>
    <section class="three">Section Three</section>
    <section class="four">Section Four</section>
  </div>

  <script>
    const container = document.getElementById('scrollContainer');
    const sections = document.querySelectorAll('section');
    let currentIndex = 0;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();

      if (e.deltaY > 0 && currentIndex < sections.length - 1) {
        currentIndex++;
      } else if (e.deltaY < 0 && currentIndex > 0) {
        currentIndex--;
      }

      container.style.transform = `translateX(-${currentIndex * 100}vw)`;

      sections.forEach((section, index) => {
        section.classList.toggle('active', index === currentIndex);
      });
    }, { passive: false });
  </script>

</body>
</html>
